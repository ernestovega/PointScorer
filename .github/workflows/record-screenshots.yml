name: Record screenshots

# Run manually (Actions tab > Record screenshots > Run workflow, choosing the branch) after an
# intended UI change. It re-records the Roborazzi reference images and commits them to that branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Record
        run: |
          rm -f app/src/test/screenshots/*.png
          ./gradlew recordRoborazziDebug --stacktrace

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/screenshots

      - name: Commit reference images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Record screenshot references"
            git push
          fi
