name: Tests

on:
  pull_request:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write  # only used to commit the first screenshot references to a PR branch

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-screenshot:
    name: Unit, Robolectric and screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit + Robolectric tests and coverage
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport --stacktrace

      # Compares against app/src/test/screenshots. If a branch has no reference images yet, they are
      # recorded and committed to it (same-repo PRs only). Re-record later with "Record screenshots".
      - name: Screenshot tests
        run: |
          if ls app/src/test/screenshots/*.png >/dev/null 2>&1; then
            ./gradlew verifyRoborazziDebug --stacktrace
          else
            echo "::warning::No reference screenshots committed yet, recording them"
            ./gradlew recordRoborazziDebug --stacktrace
            if [ "${{ github.event_name }}" = "pull_request" ] && \
               [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add app/src/test/screenshots/*.png
              git commit -m "Record screenshot references"
              git push
            fi
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/coverage/test/debug
            app/build/outputs/roborazzi
            app/src/test/screenshots

  instrumented:
    name: Espresso UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Espresso tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/androidTests
