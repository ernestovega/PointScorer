name: Tests

on:
  pull_request:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-screenshot:
    name: Unit, Robolectric and screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit + Robolectric tests and coverage
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport --stacktrace

      # Compares against app/src/test/screenshots. Until reference images are committed
      # (run the "Record screenshots" workflow) the screenshots are only recorded and uploaded.
      - name: Screenshot tests
        run: |
          if ls app/src/test/screenshots/*.png >/dev/null 2>&1; then
            ./gradlew verifyRoborazziDebug --stacktrace
          else
            echo "::warning::No reference screenshots committed yet, recording them instead of verifying"
            ./gradlew recordRoborazziDebug --stacktrace
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/coverage/test/debug
            app/build/outputs/roborazzi
            app/src/test/screenshots

  instrumented:
    name: Espresso UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Espresso tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/androidTests
